# wt hub — outer layout: top bar + sidebar pane + inner client pane
#
# The top bar is tmux's own status line rather than a third pane: it spans the
# full width for free, survives resizes, and cannot disturb the sidebar layout.
# Buttons are #[range=user|<name>] regions; MouseDown1Status hands the clicked
# range to topbar-click.sh.
set -g status on
set -g status-position top
set -g status-justify left
set -g status-interval 5
set -g status-style "bg=colour236,fg=colour250"
set -g status-left-length 200
set -g status-right-length 80
# single-window hub: hide the window list entirely
set -g window-status-format ""
set -g window-status-current-format ""
set -g status-left "#[bg=colour24,fg=colour255,bold] wt #[bg=colour236,fg=colour250] #[range=user|cursor,bg=colour238,fg=colour252] Cursor #[norange,bg=colour236] #[range=user|scratch,bg=colour238,fg=colour252] Scratch #[norange,bg=colour236] #[range=user|new,bg=colour238,fg=colour252] + New #[norange,bg=colour236] #[range=user|orch,bg=colour238,fg=colour252] ★ Orchestrator #[norange,bg=colour236] "
set -g status-right "#[fg=colour245]F2 #(cat $HOME/.local/state/wt/keys/F2 2>/dev/null) "
# output discarded — see the F2 note below for why that is not optional
bind -n MouseDown1Status run-shell -b "$HOME/.config/wt/topbar-click.sh '#{mouse_status_range}' '#{client_tty}' >/dev/null 2>&1"
set -g prefix C-q
unbind C-b
bind C-q send-prefix
set -g mouse on
# the outer layer must both emit and forward OSC 52, or a container's copy never
# reaches the Mac clipboard through the ssh + nested-tmux chain
set -g set-clipboard on
set -as terminal-features ',*:clipboard'
set -g escape-time 10
set -g focus-events on
set -g default-terminal "tmux-256color"
set -g pane-border-style "fg=colour236"
set -g pane-active-border-style "fg=colour240"
# C-q s — jump between sidebar and session pane
bind s if -F '#{pane_at_left}' 'select-pane -R' 'select-pane -L'
# C-q t — scratch claude in a floating popup, from anywhere in the hub
bind t display-popup -T ' scratch · Esc cancels ' -E -w 55% -h 55% -x 0 -y S \
  "$HOME/.config/wt/peek-attach.sh scratch"
# F1-F8 peek whichever session is bound to that key (assign with 1-8 in the
# sidebar, or `wt key F3 <session>`). First press peeks in a corner popup, Esc
# cancels, the same key again jumps in.
# Output MUST be discarded: tmux renders run-shell output by dropping the active
# pane into copy mode, which hides the sidebar behind a scrollback view.
bind -n F1 run-shell -b "$HOME/.config/wt/peek.sh F1 '#{client_tty}' >/dev/null 2>&1"
bind -n F2 run-shell -b "$HOME/.config/wt/peek.sh F2 '#{client_tty}' >/dev/null 2>&1"
bind -n F3 run-shell -b "$HOME/.config/wt/peek.sh F3 '#{client_tty}' >/dev/null 2>&1"
bind -n F4 run-shell -b "$HOME/.config/wt/peek.sh F4 '#{client_tty}' >/dev/null 2>&1"
bind -n F5 run-shell -b "$HOME/.config/wt/peek.sh F5 '#{client_tty}' >/dev/null 2>&1"
bind -n F6 run-shell -b "$HOME/.config/wt/peek.sh F6 '#{client_tty}' >/dev/null 2>&1"
bind -n F7 run-shell -b "$HOME/.config/wt/peek.sh F7 '#{client_tty}' >/dev/null 2>&1"
bind -n F8 run-shell -b "$HOME/.config/wt/peek.sh F8 '#{client_tty}' >/dev/null 2>&1"
