# wt inner server — where worktree sessions live
set -g mouse on
# one-key close for popup widgets (detaching the right pane is harmless —
# attach.sh re-attaches instantly)
bind -n 'C-\' detach-client
# scratch sessions run with key-table "popup" (set by wt scratch): ctrl-t
# closes the popup, mirroring the t that opens it. A custom table skips the
# root table entirely, so ctrl-\ must be re-bound here to keep working.
# Trade-off: inside scratch, ctrl-t no longer reaches claude's todo toggle.
bind -T popup F1 detach-client
bind -T popup C-t detach-client
bind -T popup 'C-\' detach-client
# `peek` table: active only while a session is shown in a peek popup.
# Esc is the universal cancel; pressing the same Fn key again jumps in.
# Unbound keys still reach the pane, so typing in claude works normally.
bind -T peek Escape detach-client
bind -T peek 'C-\' detach-client
bind -T peek F1 run-shell -b "$HOME/.config/wt/peek-jump.sh '#{client_session}' '#{client_tty}' >/dev/null 2>&1"
bind -T peek F2 run-shell -b "$HOME/.config/wt/peek-jump.sh '#{client_session}' '#{client_tty}' >/dev/null 2>&1"
bind -T peek F3 run-shell -b "$HOME/.config/wt/peek-jump.sh '#{client_session}' '#{client_tty}' >/dev/null 2>&1"
bind -T peek F4 run-shell -b "$HOME/.config/wt/peek-jump.sh '#{client_session}' '#{client_tty}' >/dev/null 2>&1"
bind -T peek F5 run-shell -b "$HOME/.config/wt/peek-jump.sh '#{client_session}' '#{client_tty}' >/dev/null 2>&1"
bind -T peek F6 run-shell -b "$HOME/.config/wt/peek-jump.sh '#{client_session}' '#{client_tty}' >/dev/null 2>&1"
bind -T peek F7 run-shell -b "$HOME/.config/wt/peek-jump.sh '#{client_session}' '#{client_tty}' >/dev/null 2>&1"
bind -T peek F8 run-shell -b "$HOME/.config/wt/peek-jump.sh '#{client_session}' '#{client_tty}' >/dev/null 2>&1"
# Clipboard. Default is "external": tmux forwards an application's OSC 52 but
# never emits one for its OWN copy-mode selection — so selecting text in a
# session copied nothing to the Mac. "on" makes tmux emit OSC 52 itself, and the
# terminal-features line tells it the outer terminal can receive it (inside ssh
# the container cannot detect that on its own).
set -g set-clipboard on
set -as terminal-features ',*:clipboard'
set -g history-limit 100000
set -g base-index 1
set -g escape-time 10
set -g focus-events on
set -g default-terminal "tmux-256color"
# status bar shows session name + its windows (your terminals)
set -g status-style "bg=colour234,fg=colour245"
set -g status-left "#[bold,fg=colour214] #S #[default] "
set -g status-left-length 32
set -g status-right "#[fg=colour245]%H:%M "
setw -g window-status-current-style "bold fg=colour214"
